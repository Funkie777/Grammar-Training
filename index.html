                content: `The rule is simple: use subject pronouns (I, he, she, they, we) when the pronoun does the action. Use object pronouns (me, him, her, them, us) when the pronoun receives the action.

Subject pronouns: I, you, he, she, it, we, they
Object pronouns: me, you, him, her, it, us, them

The trick: Remove the other person from the sentence and see what sounds right. If you say "John and I went," try removing John: "I went" — that works. "Me went" doesn't. So "I" is correct.

A common error in professional writing is using 'myself' as a replacement for 'I' or 'me'. Only use 'myself' for reflexive actions ("I hurt myself") or for emphasis ("I did it myself"). Never use it as a substitute for I or me.

Prepositions like between, for, to, with, and from always take object pronouns. So it is always "between you and me," "for him and her," "with us," etc.`,

                content: `Use 'that' for essential information (no commas). Use 'which' for extra information (with commas).

A restrictive clause uses 'that' and narrows down which specific thing you mean. Removing it would change the sentence's meaning. Example: "The file that is on my desk needs signing" — removing the clause leaves "The file needs signing," which could mean any file. The clause is essential.

A non-restrictive clause uses 'which' and simply adds bonus information. Removing it leaves the sentence's core meaning intact. Example: "The contract, which arrived yesterday, is ready to sign" — removing the clause still tells you the contract is ready. The information is extra.

A useful memory device: 'which' hunts with a pack (commas), while 'that' hunts alone (no commas).

Note: In British English, 'which' is sometimes used for both types. In American business writing, follow the that/which distinction consistently.`,

                content: `A comma splice joins two complete sentences (independent clauses) with just a comma. This is wrong.

An independent clause can stand alone as a sentence — it has its own subject and verb with a complete thought. When you join two of them with only a comma, you create a comma splice.

Fix a comma splice using one of four methods:
1. Period — make them two separate sentences.
2. Semicolon — connect related ideas without a conjunction.
3. Coordinating conjunction (and, but, or, nor, for, yet, so) — add one after the comma.
4. Subordinating conjunction (although, because, since, while) — turn one clause into a dependent clause.

Test: Ask yourself, could each part of the sentence stand alone? If yes, a comma alone is not enough to join them.

Comma splices are common in casual writing but are errors in formal documents, reports, and emails.`,

                    { text: "Although revenue increased, costs decreased.", note: "(fixed by subordinating one clause)", correct: true },

                content: `It's = it is or it has (contraction)
Its = belonging to it (possessive, like his or her)

The apostrophe in "it's" signals a missing letter — it is a contraction, not a possessive. This is the opposite of what most people expect, since we do use apostrophes for possession with nouns (the company's revenue). But pronouns — his, her, its, theirs, ours — never use an apostrophe for possession.

Simple test: Replace "it's" with "it is" or "it has." If the sentence still makes sense, use the apostrophe. If not, use "its" (no apostrophe).

Examples of the test:
- "It's been a difficult quarter." → "It has been a difficult quarter." ✓ — use it's
- "The brand lost it's appeal." → "The brand lost it is appeal." ✗ — use its

In professional writing, avoid contractions entirely. Write 'it is' instead of 'it's'. This applies to all business documents, reports, and formal correspondence.`,

There = location or placeholder
They're = they are (contraction, avoid in formal writing)

These three words are homophones — they sound the same but have completely different meanings and uses. Confusing them is one of the most noticeable errors in professional writing.

THEIR: Always shows possession by a group. Think of it this way — it contains the word "heir," which is about ownership and inheritance. If you can replace it with "our" (our = belonging to us, their = belonging to them), then "their" is correct.

THERE: Points to a place or introduces a statement. When it's used as a placeholder (There are five issues), it is filling the position of the real subject. You can also think of it as containing the word "here" — both refer to location.

THEY'RE: Always means "they are." Try substituting "they are" — if the sentence still works, use "they're." In formal writing, write "they are" instead.

Common test: "The clients shared ___ concerns." → Can you say "the clients shared they are concerns"? No. Can you say "the clients shared our concerns"? Yes (same structure as "their concerns"). So use "their."`,

Whom = object (receives the action)

Quick test: If you'd answer with he/she, use 'who'. If you'd answer with him/her, use 'whom'. The 'm' in 'whom' matches the 'm' in 'him' — a helpful memory trick.

Examples of the test in action:
- "Who wrote the report?" → He wrote it. Use WHO.
- "Whom did they promote?" → They promoted him. Use WHOM.
- "To whom should I address this?" → Address it to her. Use WHOM.

'Whom' is used most often after prepositions (to, from, for, with, by). Whenever you see "to ___" or "for ___," that blank will almost always need 'whom,' not 'who.'

In relative clauses within a sentence, the same rule applies: "The person who wrote this is talented" (who is the subject writing). "The person whom they promoted is talented" (whom received the action of being promoted).

Note: 'Whom' is declining in everyday speech, but it is still standard in formal business writing. Using 'who' everywhere in a formal document will mark you as less polished.`,

                content: `Affect = verb (to influence)
Effect = noun (the result)

The key distinction: 'affect' is what you do (action, verb), 'effect' is what happens as a result (end outcome, noun).

Memory trick: Use RAVEN — Remember, Affect is a Verb, Effect is a Noun.

Another way to test: Try replacing the word. If you can substitute "influence," use affect. If you can substitute "result" or "outcome," use effect.

Sentence patterns:
- "X will affect Y" — affect is the verb (X influences Y)
- "The effect of X on Y" — effect is a noun preceded by an article (the, an)
- "X had an effect" — effect follows an article, so it's a noun
- "X will affect Y" → "X will effect change" — rare verb use meaning 'to bring about'

Rare exceptions to know:
- 'Effect' as a verb means to bring something about: "The new leader effected significant change." (Brought about change — this is formal and uncommon.)
- 'Affect' as a noun appears in psychology: "The patient showed flat affect." (Don't use this in business writing.)`,

                content: `Fewer = countable items (things you can count individually)
Less = uncountable mass (things you measure as a whole)

Simple rule: If you can count it one by one, use 'fewer'. If you measure it (like water, time, money, energy), use 'less'.

Countable examples: employees, meetings, customers, applications, features, bugs — use FEWER
Uncountable examples: time, money, effort, traffic, noise, information, data — use LESS

The grocery store "10 items or less" sign is actually grammatically incorrect — it should be "10 items or fewer" because items are countable. This error is so widespread that many people accept it, but in professional writing, use the correct form.

Edge cases:
- Money as a lump sum uses 'less': "We have less than $10,000 in the budget." (measured as a total)
- Specific currency units use 'fewer': "We have fewer than ten dollar bills." (individual bills you can count)
- Time as a lump uses 'less': "It takes less time." (time measured as a whole)
- Time as units uses 'fewer': "Fewer than three days remain." (countable days)`,

- Passive: [Object] + [be verb] + [past participle] → "The proposal was approved by the board."

- 'Due to the fact that' → 'because'

- 'For the purpose of' → 'to'
- 'In the event that' → 'if'
- 'With regard to' → 'about' or 'regarding'
- 'In spite of the fact that' → 'although'

- 'Is in a position to' → 'can'
- 'On a daily basis' → 'daily'

                content: `Items in a list must have the same grammatical structure — this is called parallel structure (or parallelism).

If you start with verbs, use verbs throughout. If you start with nouns, use nouns. If you start with gerunds (-ing forms), keep going with gerunds. Mixing structures within a list creates jarring, unprofessional writing.

Forms that must match:
- Nouns: "We value quality, speed, and innovation." (not "quality, speed, and being innovative")
- Infinitives: "We aim to hire, to train, and to retain talent."
- Gerunds: "We focus on hiring, training, and retaining talent."
- Past-tense verbs: "She analyzed the data, reviewed the results, and submitted her report."
- Adjectives: "The candidate is skilled, motivated, and reliable." (not "skilled, motivated, and has reliability")

2. Job descriptions and resume bullet points
3. Comparisons: "X is more Y than Z" structures

Wrong: "After reviewing the data, the decision was made."
The decision didn't review the data — we did.

Right: "After reviewing the data, we made the decision."
Now we reviewed the data, and we made the decision. They match.

Dangling modifiers happen most often when:
1. You use passive voice after an introductory phrase ("the report was filed" instead of "we filed the report")
2. You use a participial phrase (-ing or -ed) that doesn't match the actual subject

- Or rewrite the introductory phrase as a full clause ("After we reviewed the data,...")

When list items already have commas inside them, use semicolons between items to prevent confusion about what goes with what.

Weak: "We conducted an analysis of the data."

Nominalizations often appear as -tion, -ment, -ance, -ence, or -ity endings bolted onto verbs.

Common nominalizations to eliminate:
Nominalized phrase → Strong verb
- make a decision → decide
- conduct an investigation → investigate
- provide assistance → assist
- give consideration to → consider
- make an improvement → improve
- come to an agreement → agree
- perform an assessment → assess
- provide a recommendation → recommend
- offer an explanation → explain
- undertake a review → review

The second clause explains or amplifies the first.

- Wrong: "The team members are: Alex, Sam, and Chris."

- Present tense for current truths: "The market shows strong growth potential."

TRICKY CASE 2 — Intervening phrases don't change the subject:

"Each of the proposals requires review." (not require)

The verb agrees with the subject closest to it.
"Neither the managers nor the CEO wants to proceed." (CEO is closest — singular)

KEY PAIRS TO MEMORIZE:
- Different from (not "different than" in formal writing)
- Comply with (not "comply to")
- Identical to (not "identical with")
- Independent of (not "independent from")
- Consist of (not "consist in" or "consist with")
- Responsible for (not "responsible of")
- Agree with a person, agree to a proposal, agree on terms
- Argue with a person, argue about/over a topic
- Compare to (note similarity), compare with (examine differences)
- Contrast with (not "contrast to")
- Equivalent to (not "equivalent with")
- Comply with (regulations, rules, standards)
- Interfere with (not "interfere in" unless used idiomatically)

THE PREPOSITION AT THE END OF A SENTENCE:
The old rule against ending sentences with prepositions is a myth that was never a genuine rule of English grammar. "This is something we need to think about" is perfectly correct. The stilted "This is something about which we need to think" is grammatically correct but needlessly formal. Use your judgment — in formal writing, restructure if easy; don't if it sounds unnatural.

When unsure about a preposition pair, look it up. Idioms must be memorized.`,

                title: "Redundancy Elimination",
                topic: "Cutting Duplicate Meaning",
                content: `Redundancy means using two words or phrases that mean the same thing. Remove redundant words — they waste the reader's time and signal careless writing.

The test: Remove one word. Does the remaining phrase still mean exactly the same thing? If yes, the removed word was redundant.

COMMON REDUNDANT PHRASES TO ELIMINATE:
- "Past history" → history (history is always past)
- "Advance planning" → planning (planning is always done in advance)
- "End result" → result (a result is already an end point)
- "Brief summary" → summary (summaries are by definition brief)
- "Completely eliminate" → eliminate (eliminate already means complete removal)
- "Currently ongoing" → ongoing (ongoing means currently happening)
- "Future plans" → plans (plans are always future-oriented)
- "Free gift" → gift (gifts are free by definition)
- "True fact" → fact (facts are true by definition)
- "New innovation" → innovation (innovations are new by definition)
- "Consensus of opinion" → consensus (consensus is already about opinion)

                content: `Register is the level of formality in your writing. Choosing the right register is a professional skill — using informal language in a formal context looks unprofessional, while being overly formal in casual communication sounds stiff and unfriendly.

FORMAL writing (board reports, proposals, legal documents, formal emails, executive memos):

- Complete sentences: avoid fragments

INFORMAL writing (team chats, internal Slack, casual emails to close colleagues):
- Contractions are fine and make you sound approachable
- Conversational vocabulary is appropriate

                content: `A misplaced modifier is a word or phrase that is placed too far from the thing it describes, causing ambiguity or unintended meaning. The rule: place modifiers directly next to what they modify.

THE MOST COMMON OFFENDERS: only, just, nearly, almost, even, merely, exactly, simply

These small words change meaning dramatically depending on placement:

"Only she told him the truth." (No one else told him.)
"She only told him the truth." (That's all she did — told him.)
"She told only him the truth." (She didn't tell others.)
"She told him only the truth." (Nothing else — no lies.)

Each is grammatically correct, but they mean different things. In business writing, place 'only' directly before the specific element it modifies.

"We only need three signatures." (ambiguous)
"We need only three signatures." (clearer — three, not more)

THE SQUINTING MODIFIER: A modifier that could describe either what comes before or after it.
"Employees who work overtime often get burnout."
Does "often" modify "work overtime" or "get burnout"?

            document.getElementById('current-day').textContent = progress.currentDay;

            const avgScore = scores.length > 0

                : 0;
            document.getElementById('total-score').textContent = avgScore;

        function renderDaySelector() {
            const selector = document.getElementById('day-selector');
            selector.innerHTML = '';
            
            for (let i = 1; i <= 30; i++) {

                btn.className = 'day-btn';
                btn.textContent = 'Day ' + i;
                
                if (progress.completedDays.includes(i)) {
                    btn.classList.add('completed');

                if (i === progress.currentDay) {

                <div class="quiz">

            container.innerHTML = html;

        const selectedAnswers = {};

        function selectOption(questionIndex, optionIndex) {
            selectedAnswers[questionIndex] = optionIndex;
            
            const options = document.querySelectorAll(`[data-question="${questionIndex}"]`);
            options.forEach(opt => opt.classList.remove('selected'));
            options[optionIndex].classList.add('selected');
        }

        function checkAnswers() {
            const lesson = lessons[progress.currentDay - 1];
            let correct = 0;
            
            lesson.questions.forEach((q, i) => {
                const userAnswer = selectedAnswers[i];

                const options = document.querySelectorAll(`[data-question="${i}"]`);

                    options[q.correct].classList.add('correct-answer');
                    if (!isCorrect) {
                        options[userAnswer].classList.add('wrong-answer');

            const score = Math.round((correct / lesson.questions.length) * 100);

        function nextDay() {
