                topic: "I vs Me, They vs Them",
                content: `Use "I" when you're doing the action. Use "me" when something is being done to you.

Quick test: Remove the other person. "John and I went" → "I went" ✓. "John and me went" → "me went" ✗.

Mistake to avoid: Don't use "myself" instead of "me". Wrong: "Contact myself if you have questions." Right: "Contact me." Only use "myself" when you're the subject too — "I hurt myself."

After prepositions (between, for, to, with), always use "me" not "I". It's always "between you and me", never "between you and I."`,

                    { text: "John and I went to the meeting.", note: "(subject — I went, not me went)", correct: true },
                    { text: "The report was sent to Sarah and me.", note: "(object — sent to me, not sent to I)", correct: true },

            {
                day: 2,
                title: "That vs Which",
                topic: "Restrictive vs Non-restrictive Clauses",
                content: `"That" introduces essential information — remove it and the meaning changes. "Which" (always with commas) adds bonus information — remove it and the sentence still makes sense.

Memory trick: "which" always travels with commas. No commas? Use "that".

Test it: "The car that is parked outside is mine." Remove the clause: "The car is mine" — but which car? The clause is essential, so use "that", no commas. "My car, which is red, is outside." Remove the clause: "My car is outside" — still clear. Use "which" with commas.

Everyday mistake: "The film which won the award was brilliant." Remove the clause — "The film was brilliant." But which film? It's essential, so it should be "The film that won the award."`,
                examples: [
                    { text: "The report that was submitted late needs revision.", note: "(restrictive — specifies which report)", correct: true },
                    { text: "The report, which was 50 pages, needs revision.", note: "(non-restrictive — extra detail about one known report)", correct: true },
                    { text: "Products that fail testing are rejected.", note: "(restrictive — only the ones that fail, not all products)", correct: true },
                    { text: "Our new software, which launched in March, has 5,000 users.", note: "(non-restrictive — 'which launched in March' adds context)", correct: true },
                    { text: "The clause which is most important appears on page 3.", note: "(should be 'that' — essential, no commas)", correct: false },
                    { text: "Any employee that violates the policy will be reviewed.", note: "(restrictive 'that' — specifies which employees)", correct: true }
                ],

            {

                title: "Comma Splices",
                topic: "Fixing Run-on Sentences",
                content: `A comma splice is when you join two complete sentences with just a comma. A comma isn't strong enough to hold two full sentences together.

Wrong: "I was tired, I went to bed." Right: "I was tired, so I went to bed." OR "I was tired. I went to bed."

Four ways to fix a comma splice:
1. Period — make two sentences.
2. Semicolon — for closely related ideas.
3. Joining word (and, but, or, so, yet) — add it after the comma.
4. Because/although/since — make one part dependent.

Test: Can each part stand alone as its own sentence? If yes, a comma alone won't cut it.`,
                examples: [
                    { text: "Revenue increased, costs decreased.", note: "(comma splice — two independent clauses joined by only a comma)", correct: false },
                    { text: "Revenue increased, and costs decreased.", note: "(fixed with coordinating conjunction 'and')", correct: true },
                    { text: "Revenue increased; costs decreased.", note: "(fixed with semicolon)", correct: true },
                    { text: "Revenue increased. Costs decreased.", note: "(fixed with a period — two complete sentences)", correct: true },
                    { text: "Although revenue increased, costs decreased.", note: "(fixed by subordinating one clause)", correct: true },
                    { text: "The client called, we need to respond immediately.", note: "(comma splice — needs 'and' or a period between clauses)", correct: false }

            {
                day: 4,

                content: `It's = it is (or it has). Its = belonging to it.

Test: Swap in "it is". "It's raining" → "It is raining" ✓. "The dog wagged it's tail" → "The dog wagged it is tail" ✗ — use "its".

Memory trick: Possessive pronouns never get apostrophes — his, her, its, ours, theirs. No exceptions.

This is one of the most common writing mistakes around. The apostrophe in "it's" is for a missing letter (a contraction), not for possession.`,

            {
                day: 5,
                title: "Their, There, They're",

                content: `Their = belonging to them. There = a place or placeholder. They're = they are.

Three quick tests:
- They're: swap in "they are" — if it works, use they're. "They're late" = "They are late" ✓
- Their: swap in "our" — same structure. "Their house" / "our house" — both work ✓
- There: everything else — locations ("over there") and "there is/are" constructions

                examples: [

            {

                content: `Who = subject (does the action). Whom = object (receives it).

Quick test: Answer with he/she or him/her. "Who called?" → "He called" → use WHO. "Whom did you call?" → "I called him" → use WHOM. The m's match: him → whom.

After prepositions (to, from, for, with, by), always use whom: "To whom it may concern", "the person with whom I spoke."

In everyday speech, many people use "who" for everything. In writing, especially formal writing, using "whom" correctly signals care and polish.`,

                    { text: "Whom did you meet? (I met her.)", note: "(object — use whom)", correct: true },

                examples: [

        let progress = JSON.parse(localStorage.getItem('grammarProgress')) || {
            currentDay: 1,
            completedDays: [],
            scores: {}
        };

        function saveProgress() {
            localStorage.setItem('grammarProgress', JSON.stringify(progress));
        }

        function updateStats() {
            document.getElementById('current-day').textContent = progress.currentDay;
            document.getElementById('completed-count').textContent = progress.completedDays.length;
            
            const scores = Object.values(progress.scores);
            const avgScore = scores.length > 0 
                ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)
                : 0;
            document.getElementById('total-score').textContent = avgScore;
            
            const progressPercent = (progress.completedDays.length / 30) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
        }

        function renderDaySelector() {
            const selector = document.getElementById('day-selector');
            selector.innerHTML = '';
            
            for (let i = 1; i <= 30; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = 'Day ' + i;
                
                if (progress.completedDays.includes(i)) {
                    btn.classList.add('completed');
                }
                if (i === progress.currentDay) {
                    btn.classList.add('current');
                }
                
                btn.onclick = () => loadDay(i);
                selector.appendChild(btn);
            }
        }

        function loadDay(dayNum) {
            progress.currentDay = dayNum;
            saveProgress();
            renderLesson(lessons[dayNum - 1]);
            renderDaySelector();
            updateStats();
        }

        function renderLesson(lesson) {
            const container = document.getElementById('lesson-container');
            
            let html = `
                <div class="day-header">
                    <h2>Day ${lesson.day}: ${lesson.title}</h2>
                    <div>${lesson.topic}</div>
                </div>
                
                <div class="lesson">
                    <h3>Today's Lesson</h3>
                    ${lesson.content.split('\n\n').map(p => `<p>${p}</p>`).join('')}
                    
                    <h3 style="margin-top: 20px;">Examples</h3>
                    ${lesson.examples.map(ex => `
                        <div class="example">
                            <span class="${ex.correct ? 'correct' : 'incorrect'}">${ex.correct ? '✓' : '✗'}</span>
                            ${ex.text}
                            <div style="font-size: 13px; color: #666; margin-top: 5px;">${ex.note}</div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="quiz">
                    <h3 style="margin-bottom: 15px;">Quick Test (${lesson.questions.length} questions)</h3>
                    ${lesson.questions.map((q, i) => `
                        <div class="question" id="q${i}">
                            <div class="question-text">${i + 1}. ${q.q}</div>
                            <div class="options">
                                ${q.options.map((opt, j) => `
                                    <div class="option" data-question="${i}" data-option="${j}" onclick="selectOption(${i}, ${j})">
                                        ${opt}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="feedback" id="feedback${i}" style="display: none;"></div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="navigation">
                    <button onclick="checkAnswers()" id="check-btn">Check Answers</button>
                    ${progress.currentDay < 30 ? '<button onclick="nextDay()" id="next-btn" disabled>Next Day</button>' : ''}
                    <button class="complete-btn" onclick="markComplete()" id="complete-btn" disabled>Mark Complete</button>
                </div>
                
                <div id="day-complete-msg" style="display: none;" class="day-complete">
                    Day ${lesson.day} completed! Score: <span id="day-score"></span>%
                </div>
            `;
            
            container.innerHTML = html;
        }

        const selectedAnswers = {};

        function selectOption(questionIndex, optionIndex) {
            selectedAnswers[questionIndex] = optionIndex;
            
            const options = document.querySelectorAll(`[data-question="${questionIndex}"]`);
            options.forEach(opt => opt.classList.remove('selected'));
            options[optionIndex].classList.add('selected');
        }

        function checkAnswers() {
            const lesson = lessons[progress.currentDay - 1];
            let correct = 0;
            
            lesson.questions.forEach((q, i) => {
                const userAnswer = selectedAnswers[i];
                const feedback = document.getElementById(`feedback${i}`);
                const options = document.querySelectorAll(`[data-question="${i}"]`);
                
                options.forEach(opt => {
                    opt.classList.remove('correct-answer', 'wrong-answer');
                });
                
                if (userAnswer !== undefined) {
                    const isCorrect = userAnswer === q.correct;
                    if (isCorrect) correct++;
                    
                    feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                    feedback.textContent = q.explanation;
                    feedback.style.display = 'block';
                    
                    options[q.correct].classList.add('correct-answer');
                    if (!isCorrect) {
                        options[userAnswer].classList.add('wrong-answer');
                    }
                }
            });
            
            const score = Math.round((correct / lesson.questions.length) * 100);
            progress.scores[progress.currentDay] = score;
            saveProgress();
            updateStats();
            
            document.getElementById('day-score').textContent = score;
            document.getElementById('day-complete-msg').style.display = 'block';
            document.getElementById('complete-btn').disabled = false;
            document.getElementById('check-btn').disabled = true;
            
            if (progress.currentDay < 30) {
                document.getElementById('next-btn').disabled = false;
            }
        }

        function markComplete() {
            if (!progress.completedDays.includes(progress.currentDay)) {
                progress.completedDays.push(progress.currentDay);
                saveProgress();
                renderDaySelector();
                updateStats();
            }
        }

        function nextDay() {
            if (progress.currentDay < 30) {
                loadDay(progress.currentDay + 1);
            }
        }

        function resetProgress() {
            if (confirm('Reset all progress? This cannot be undone.')) {
                localStorage.removeItem('grammarProgress');
                progress = {
                    currentDay: 1,
                    completedDays: [],
                    scores: {}
                };
                loadDay(1);
            }
        }

        // Initialize
        renderDaySelector();
        loadDay(progress.currentDay);
    </script>
</body>
</html>
